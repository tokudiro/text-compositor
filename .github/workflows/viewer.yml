name: Viewer

# Viewer（Obunzu、viewer/）のテスト（#172）。text-compositor本体のテスト（test.yml）とは、別のワークフローにする
# （ツールも、成果物も、公開先も違うため。方針は、doc/gui-viewer-design.md）。
#
# 実行するもの:
#   - Node.jsのテスト（`npm test`。偽のワーカーで、クライアントの動きを確認する）
#   - 実際のPythonワーカーとの結合の確認（viewer/test/worker-integration.test.js。render_htmlの往復）
# ElectronのGUIの起動は、CIでは確認しない（画面が要り、不安定になりやすいため）。手元で、viewer/scripts/check-*.jsを使う。
#
# paths: viewer/のほか、Viewerが使うPythonの側（HTML出力・ワーカー・API。これらが使う他のモジュールも含めて、
# text_compositor/全体）と、その依存（pyproject.toml）。Pythonの変更で、Viewerとの結合が壊れていないかを、確認する。
#
# workflow_call: リリース（viewer-release.yml）が、配布物を作る前に、同じテストを実行するために、呼び出す。
#
# 権限は、読み取りだけ。PyPIへの公開（release.yml）の権限は、このワークフローには、与えない。
on:
  push:
    branches: [master]
    paths:
      - "viewer/**"
      - "text_compositor/**"
      - "pyproject.toml"
      - ".github/workflows/viewer.yml"
  pull_request:
    paths:
      - "viewer/**"
      - "text_compositor/**"
      - "pyproject.toml"
      - ".github/workflows/viewer.yml"
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    # Viewerの対象は、Windows（後続で、Linux・macOSを検討する。#165）。パスの扱いや、プロセスの終了（taskkill）が
    # Windows固有のため、対象のOSで確認する。
    runs-on: windows-latest
    env:
      # ワーカーとの結合テストは、Pythonの準備がないと、手元では、飛ばす。CIでは、飛ばさず、失敗にする
      # （準備の不備を、見逃さないため）。
      REQUIRE_WORKER_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"   # viewer/package.jsonの engines（>=22.12）
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      # 配布物（組込版Python 3.12）と、同じ版のPythonで確認する。
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: viewer/dist-requirements.txt

      # Viewerのワーカーが使うPythonのパッケージ（HTML出力に必要なものだけ。typstとplaywrightは、要らない）
      - name: Install the worker's Python packages
        run: pip install -r viewer/dist-requirements.txt

      # テストは、Electronを起動しない。数百MBのElectronの本体を、取得しないように、スクリプト（postinstall）を飛ばす。
      - name: Install Node packages
        working-directory: viewer
        run: npm ci --ignore-scripts

      - name: Run the tests
        working-directory: viewer
        run: npm test
