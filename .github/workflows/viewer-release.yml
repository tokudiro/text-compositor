name: Viewer release

# Viewer（Obunzu）の配布物（Windows向けのポータブルZIP、#168）を作る（#172）。
#
# 通常は、text-compositor本体と、同時にリリースする。Obunzuは、同じバージョンのtext_compositorを同梱し、
# バージョンも、そろえる決まりのため（tests/test_viewer_version.py）。`v<バージョン>`のタグを、1つだけpushすると、
# release.yml（使い方ガイドのPDFと、PyPIへの公開）が動き、その中の`build-viewer`が、このワークフローを呼び出して、ZIPを作る
# （workflow_call）。ZIPは、release.ymlの`attach-viewer`が、同じReleaseに添付する（このワークフローは、添付しない）。
#
# Obunzuだけの修正を出す例外の場合は、`obunzu-v<バージョン>`のタグをpushする。このワークフローが、テスト → ビルド →
# Releaseの作成と添付までを行う。text-compositor本体の版は、上がらない（PyPIへの公開も、動かない）。`v`で始まらない名前に
# するのは、release.ymlが`v*`のタグで動くため（`viewer-v0.3.5`のような名前は、`v`で始まり、一致してしまう）。
#
# バージョン: viewer/package.jsonの`version`と、タグをそろえる（`v<バージョン>`か、`obunzu-v<バージョン>`。そろっていなければ、失敗する）。
#
# 手動実行（workflow_dispatch）: 配布物を作って、成果物（artifact）として保存するだけ。Releaseは、作らない。
# タグを打つ前に、配布物のビルドが通ることを、確認するために使う。
#
# 権限: 既定は、読み取りだけ。Releaseへの添付（contents: write）は、この中のreleaseジョブ（例外の道）と、
# release.ymlのattach-viewerジョブだけに与える。PyPIのTrusted Publishing（release.ymlの`pypi`環境）とは、関係しない
# （id-tokenの権限は、与えない）。
on:
  push:
    tags:
      - "obunzu-v*"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  # 配布物を作る前に、Viewerのテストを、同じ内容で実行する
  test:
    uses: ./.github/workflows/viewer.yml

  dist:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # `v<バージョン>`（text-compositorと同時のリリース）か、`obunzu-v<バージョン>`（Obunzuだけの例外）
      - name: Check that the tag matches the version in viewer/package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./viewer/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ] && [ "${GITHUB_REF_NAME}" != "obunzu-v${version}" ]; then
            echo "::error::The tag ${GITHUB_REF_NAME} does not match viewer/package.json (version ${version}). Expected v${version} or obunzu-v${version}."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      # ビルド用のPython（組込版のパッケージを、pipで取得するために使う。build-dist.jsが、PATHのpythonを使う）
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # build-dist.jsが取得する、組込版Python・ライセンス（SHA256を確認する）の保存先。バージョンが変わるまで、再取得しない。
      - name: Cache the downloads of build-dist.js
        uses: actions/cache@v5
        with:
          path: viewer/dist/.cache
          key: viewer-dist-${{ runner.os }}-${{ hashFiles('viewer/scripts/build-dist.js') }}

      # Electron本体（zip。約151 MB）の保存先。`npm ci`（electronのpostinstall）と、`@electron/packager`が、同じ場所
      # （@electron/getの既定。WindowsはLOCALAPPDATA\electron\Cache）に取得する。CIは、使い捨ての環境のため、保存しないと、
      # 実行のたびに、取得する。キーは、Electronの版にする（package.jsonのversionは、リリースごとに変わるため、
      # ハッシュにすると、毎回、作り直しになる）。ツール群の方針（doc/spec.md 2章）: CIの取得量は、できるだけ減らす。
      - name: Read the Electron version
        id: electron
        shell: bash
        run: echo "version=$(node -p "require('./viewer/package.json').devDependencies.electron")" >> "$GITHUB_OUTPUT"

      - name: Cache the Electron download
        uses: actions/cache@v5
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ steps.electron.outputs.version }}

      - name: Install Node packages
        working-directory: viewer
        run: npm ci

      - name: Build the portable ZIP
        working-directory: viewer
        run: npm run build-dist

      - uses: actions/upload-artifact@v6
        with:
          name: obunzu-win-x64
          path: viewer/dist/Obunzu-*-win-x64.zip
          if-no-files-found: error

  release:
    needs: dist
    # タグのpushのときだけ。手動実行では、Releaseを作らない
    if: startsWith(github.ref, 'refs/tags/obunzu-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Releaseの作成と、ファイルの添付
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: obunzu-win-x64
          path: dist

      - name: Attach the ZIP to the release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/Obunzu-*-win-x64.zip
          # ViewerのReleaseが、text-compositor本体（PyPI）のReleaseの「Latest」表示を、奪わないようにする
          make_latest: false
          # 本文は、たたき台として、自動生成する。公開後に、`gh release edit`で、書き直す（英日併記）
          generate_release_notes: true
