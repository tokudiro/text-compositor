name: Test

# テスト対象（text_compositor/・tests/・依存関係）を変更したpush/PRでのみpytestを実行する（#97）。
# doc/やsample/等の無関係な変更ではCIを起動しない。
# viewer/package.jsonは、Viewerのバージョンをtext-compositorと揃える確認（tests/test_viewer_version.py）、
# viewer/dist-requirements.txtは、配布物の依存をpyproject.tomlと揃える確認（tests/test_distribution.py）のために含める（#194・#168）。
#
# push: masterブランチのみを対象にする。作業ブランチへの毎pushも対象にすると、PRを開いた
# 時点で同じコミットにpull_requestイベントも発火し、同一コミットへの重複実行になるため。
# masterへのpushは、PRを経ない直接コミット（バージョン番号変更等）に対する安全網として残す。
#
# pull_request: PRブランチへコミットが追加されるたびに実行し、マージ前にチェックする。
on:
  push:
    branches: [master]
    paths:
      - "text_compositor/**"
      - "build.py"
      - "tests/**"
      - "requirements*.txt"
      - "viewer/package.json"
      - "viewer/dist-requirements.txt"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "text_compositor/**"
      - "build.py"
      - "tests/**"
      - "requirements*.txt"
      - "viewer/package.json"
      - "viewer/dist-requirements.txt"
      - ".github/workflows/test.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements*.txt

      # フォント（Noto Sans JP）など、初回に取得するものと、Typstのパッケージ（@preview/...）を、実行をまたいで
      # 保存する（#189）。CIは、毎回まっさらな環境で始まるため、これが無いと、毎回ネットワークから取得し、
      # 一時的な失敗（GitHubのHTTP 500など）で、テストが落ちる。テンプレートやtext_compositor/のコードが変わったときは、
      # 新しいキーで保存し直す。それまでの保存は、restore-keysで引き継ぐ（取得済みのものは、再取得しない）。
      - name: Cache downloaded files (fonts, Typst packages)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/text-compositor
            ~/.cache/typst
          key: downloads-${{ runner.os }}-${{ hashFiles('text_compositor/*.py', 'text_compositor/templates/*.typ') }}
          restore-keys: |
            downloads-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/
