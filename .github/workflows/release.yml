name: Release

# バージョンタグ（v*）をpushすると、使い方ガイド（doc/usage/）をこのツール自身でPDF化し、
# そのタグのGitHub Releaseにアセットとして添付する（dogfooding、#31・#24）。
# doc/usage/text-compositor.config.yaml は graphviz/mermaid とも無効なため、
# Node.js/JRE等の追加ランタイムは不要でPython + pipのみで完結する（2章）。
#
# doc/usage/12_github_actions.mdで案内している2つの使い方（クローンして直接叩く／
# pipインストールする、#50・#111・#112）を、それぞれ別ジョブで実際にビルドし、
# リリースの度にどちらの手順も壊れていないかを継続的に検証する。
#
# Obunzu（Viewer）も、同じタグで、同時にリリースする（#172）。ZIPを作り、同じReleaseに添付する
# （build-viewer・attach-viewer）。Obunzuだけの修正を出す例外は、`obunzu-v*`のタグ（viewer-release.yml）。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # 「クローンして直接叩く」使い方（#24で実証済み）。こちらの成果物を実際にリリースへ
  # 添付する。ツール（text-compositor）とドキュメント（doc/usage/）を、あえて同一
  # コミットでも2回に分けてチェックアウトし、「別リポジトリとして使う」通常構成と
  # 全く同じ手順を踏む。text-compositor側はrepository:を指定するだけでdefault
  # ブランチ(master)を取得する（実際の外部利用でtagを固定しないのと同じ状況を再現し、
  # 最新のbuild.pyが既存のconfig.yamlと噛み合うかも同時に確認できる）。
  build-usage-guide:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (docs/config)
        uses: actions/checkout@v7
        with:
          path: this-repo

      - name: Checkout text-compositor (tool)
        uses: actions/checkout@v7
        with:
          repository: tokudiro/text-compositor
          path: text-compositor

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r text-compositor/requirements.txt

      - name: Build usage guide PDF
        run: python text-compositor/build.py --config this-repo/doc/usage/text-compositor.config.yaml

      - name: Attach PDF to release
        uses: softprops/action-gh-release@v3
        with:
          files: this-repo/doc/usage/text-compositor-usage-guide.pdf
          # 本文を自動生成する（マージ済みPRの一覧。v0.0.13までは本文が空のまま公開されて
          # いたため追加した）。カテゴリ分けした詳細なノートにしたい場合は、公開後に
          # `gh release edit`で上書きする運用のままでよい（自動生成はたたき台として機能する）。
          generate_release_notes: true

  # 「pipインストールする」使い方（#111）の継続検証。タグを固定せずdefaultブランチを
  # 直接インストールする点はbuild-usage-guideと同じ理由（最新masterの動作確認）。
  # こちらはリリースへのアセット添付は行わず、ビルドが成功することの確認のみ。
  verify-pip-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (docs/config)
        uses: actions/checkout@v7
        with:
          path: this-repo

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install text-compositor via pip
        run: pip install "git+https://github.com/tokudiro/text-compositor.git@master"

      - name: Build usage guide PDF via the text-compositor command
        run: text-compositor --config this-repo/doc/usage/text-compositor.config.yaml

  # Obunzu（Viewer）の配布物（ポータブルZIP）を作る（#172）。text-compositor本体と、同時にリリースする
  # （Obunzuは、同じバージョンのtext_compositorを同梱し、バージョンも、そろえる決まりのため）。作り方は、
  # viewer-release.ymlにある（テスト → ビルド。呼び出すだけで、Releaseへの添付は、行わない）。
  #
  # needs: Releaseは、build-usage-guideが作る。同じタグに、2つのジョブが、同時にReleaseを作って、競合しないように、
  # 順序をつける。ビルドが失敗しても、PDFとPyPIへの公開には、影響しない（他のジョブは、これを待たない）。失敗したときは、
  # 失敗したジョブだけを、再実行できる。
  build-viewer:
    needs: build-usage-guide
    uses: ./.github/workflows/viewer-release.yml

  # ZIPを、build-usage-guideが作ったReleaseに添付する。本文と「Latest」は、変えない（build-usage-guideの結果のまま）。
  # この権限（contents: write）は、ワークフロー全体の設定。PyPIの公開（id-token）は、publish-pypiだけが持つ。
  attach-viewer:
    needs: build-viewer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: obunzu-win-x64
          path: dist

      - name: Attach the Obunzu ZIP to the release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/Obunzu-*-win-x64.zip

  # タグpushのたびにPyPIへ公開する（#134）。APIトークンをGitHub Secretsに保存せず、
  # PyPIのTrusted Publishing（OIDC）を使う。事前にPyPI側で「pending publisher」として
  # このリポジトリ/ワークフローファイル名/environment名を登録しておく必要がある
  # （PyPIアカウントでの手動設定、コードでは自動化できない）。
  publish-pypi:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/text-compositor
    permissions:
      id-token: write  # Trusted Publishing用のOIDCトークン取得に必要
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install build
        run: pip install build

      # `python -m build`ではなく`pyproject-build`コマンドを使う。`-m`実行はカレント
      # ディレクトリをsys.pathの先頭に追加するため、リポジトリ直下のbuild.py（クローンして
      # 直接叩く用のラッパー、#111）が`build`パッケージより先に解決されてしまう
      # （ローカル検証で実際に発生することを確認済み）。
      - name: Build sdist and wheel
        run: pyproject-build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
