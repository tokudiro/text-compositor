[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "text-compositor"
version = "0.3.5"
description = "A tool for composing multiple text files into a PDF document."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "typst==0.15.0",
    "markdown-it-py==4.2.0",
    "mdit-py-plugins==0.6.1",
    "PyYAML==6.0.3",
    "platformdirs==4.11.9",
]

# plugins.mermaid: true（既定）を使う場合のみ必要（11章）。
# `pip install text-compositor[mermaid]` でまとめて導入できる。
[project.optional-dependencies]
mermaid = ["playwright==1.63.0"]

[project.urls]
Repository = "https://github.com/tokudiro/text-compositor"

# `text-compositor --config ...` コマンドを提供する（#111）。
# 「クローンして直接叩く」既存の使い方（`python build.py --config ...`）も
# トップレベルの build.py ラッパー経由で引き続き使える。
[project.scripts]
text-compositor = "text_compositor.build:build"

[tool.setuptools]
packages = ["text_compositor", "text_compositor.templates"]

[tool.setuptools.package-data]
text_compositor = ["templates/*.typ"]
