id: CFG-01
title: "設定値の再帰的マージ（tests/test_config.py::TestDeepUpdate）"
priority: High
rev: 1
tests: [tests/test_config.py::TestDeepUpdate]
steps: |
  - フラットなキーの上書き、ネストした辞書の一部キーだけの上書き、ネストした辞書を非辞書値で丸ごと置き換えるケース、戻り値が引数と同一オブジェクトであることを`deep_update()`で確認する。
expected: |
  - フラットなキーは単純に上書きされること
  - ネストした辞書は、指定したキーだけが上書きされ、他の既存キーは保持されること
  - 上書き先が辞書でない値の場合は、ネストせずそのまま置き換えること
  - 引数に渡した辞書自体を破壊的に更新し、それを返すこと
