id: MD-06
title: "インライン装飾の変換（tests/test_markdown_basics.py::TestInlineDecoration）"
priority: High
rev: 1
tests: [tests/test_markdown_basics.py::TestInlineDecoration]
steps: |
  - 太字・斜体・取り消し線、`[text]{color=...}`/`{size=...}`属性（色名・hex・数値+単位・数値+色の同時指定・不正な値）、`<span style="color:...">`、リンクを`render()`に渡す。
expected: |
  - 太字/斜体/取り消し線は、それぞれ`#strong[]`/`#emph[]`/`#strike[]`に変換されること
  - `{color=...}`は色名ならそのまま、hex値なら`rgb(...)`で`#text(fill: ...)`に変換されること
  - `{size=...}`は`#text(size: ...)`に変換され、color/sizeを同時指定した場合は`#text()`呼び出し1つにまとめられること
  - 不正な`size`値は無視され、`[Warning]`が出力されること（ビルドは止めない）
  - `<span style="color:...">`は`{color=...}`と同じ`#text(fill: ...)`に変換されること
  - リンクは`#link("URL")[表示テキスト]`に変換されること
