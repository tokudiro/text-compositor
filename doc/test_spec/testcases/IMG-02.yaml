id: IMG-02
title: "背景・ロゴ画像パスの解決（tests/test_asset_resolution.py::TestResolveProjectImagePath）"
priority: Medium
rev: 1
tests: [tests/test_asset_resolution.py::TestResolveProjectImagePath]
steps: |
  - `document.background`/`document.logo`相当のパスとして、`None`、project_dir基準の相対パス（存在するファイル/存在しないファイル）を`_resolve_project_image_path()`に渡す。
  - `base_dir`（project_dir）と`typst_root`が異なる場合も試す。
expected: |
  - `None`を渡した場合は`None`を返すこと（背景・ロゴ未指定として扱われること）
  - 存在するファイルは、`typst_root`起点のルート絶対パスに変換されること
  - 存在しないファイルは、フォールバックせず`sys.exit(1)`で即座に終了すること
  - `base_dir`と`typst_root`が異なる場合、変換後のパスは常に`typst_root`基準になること
