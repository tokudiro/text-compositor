id: LM-04
title: "Typstエラーへのヒント付与（tests/test_line_mapping.py::TestAnnotateTypstError）"
priority: High
rev: 1
tests: [tests/test_line_mapping.py::TestAnnotateTypstError]
steps: |
  - Typstのコンパイルエラーメッセージ（`temp_build.typ:20:5`のような位置情報を含む）と、srcmapを`_annotate_typst_error()`に渡す。
  - 同じ行番号への言及がエラーメッセージ中に複数回出るケース、srcmapが空のケース、参照位置が最初のマーカーより前のケースも試す。
expected: |
  - 解決可能な位置には、元のMarkdownファイル・行番号を示す`[Hint]`行が元のエラーメッセージに追記されること
  - 同じ行番号への重複した言及は、`[Hint]`を1回だけ出すこと
  - srcmapが空、または解決できない位置の場合は、エラーメッセージをそのまま変更しないこと
