id: LB-01
title: "layout-rightの基本動作（tests/test_layout_blocks.py::TestLayoutRight）"
priority: High
rev: 1
tests: [tests/test_layout_blocks.py::TestLayoutRight]
steps: |
  - テキストと実際の図表フェンス（`dot`）を含む`::: layout-right ... :::`ブロック、比率省略時/`{left=... right=...}`指定時、図表フェンスを含まないブロック、単独行のMarkdown画像を含むブロックを`render()`に渡す。
expected: |
  - 実際の図表フェンスが正しく検出され、テキストと図の2カラム`#grid(...)`に変換されること（`#127`の修正確認を兼ねる）
  - 比率省略時は既定の35:65、明示指定時はその値が`columns:`に反映されること
  - テキストが左、図が右のカラムに配置されること
  - 図・画像のいずれも含まないブロックは、フォールバックせず`sys.exit(1)`で即座に終了すること
  - 単独行のMarkdown画像も、フェンスと同様に検出・配置されること
