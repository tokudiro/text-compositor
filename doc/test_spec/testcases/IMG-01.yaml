id: IMG-01
title: "Markdown内画像パスの解決（tests/test_asset_resolution.py::TestResolveAsset）"
priority: High
rev: 1
tests: [tests/test_asset_resolution.py::TestResolveAsset]
steps: |
  - Markdownファイルからの相対パス（存在するファイル/存在しないファイル）、ルート絶対パス（`/...`）、URL（`https://...`）を`_resolve_asset()`に渡す。
  - `base_dir`（原稿側）と`typst_root`（`--root`相当）が異なる場合も試す。
expected: |
  - 相対パスは、`typst_root`起点のルート絶対パス（`/...`）に変換されること
  - ルート絶対パス・URLは、ファイルの存在確認をせずそのまま通すこと
  - 存在しないファイルは、フォールバックせず`sys.exit(1)`で即座に終了すること（Fail-fast）
  - `base_dir`と`typst_root`が異なる場合、変換後のパスは常に`typst_root`基準になること
