id: CFG-03
title: "chaptersエントリの解析（tests/test_config.py::TestParseChapterEntry）"
priority: High
rev: 1
tests: [tests/test_config.py::TestParseChapterEntry]
steps: |
  - `chapters:`の1エントリとして、文字列（ファイル名のみ）、`file`キーを持つ辞書、`aggregate`キーを持つ辞書、`file`/`aggregate`どちらも無い辞書、辞書でも文字列でもない値（数値）を`_parse_chapter_entry()`に渡す。
expected: |
  - 文字列は、そのファイル名・空の設定・種別`"file"`として解釈されること
  - `file`キーを持つ辞書は、そのファイル名・辞書全体・種別`"file"`として解釈されること
  - `aggregate`キーを持つ辞書は、そのディレクトリ名・辞書全体・種別`"aggregate"`として解釈されること
  - `file`/`aggregate`どちらも無い辞書、または辞書でも文字列でもない値は、`sys.exit(1)`で即座に終了すること
