id: MD-02
title: "リストの変換（tests/test_markdown_basics.py::TestLists）"
priority: High
rev: 1
tests: [tests/test_markdown_basics.py::TestLists]
steps: |
  - 箇条書き・番号付きリストと、それぞれのネスト（2階層）、GitHub形式のタスクリスト（`- [ ]`/`- [x]`）を含むMarkdownを`render()`に渡す。
expected: |
  - 箇条書きは`-`、番号付きは`+`（Typstの自動採番構文）に変換されること
  - ネストした階層は、階層の深さに応じたインデント付きで出力されること
  - タスクリストの未完了/完了チェックボックスは、それぞれ`☐`/`☑`のUnicode記号に変換されること
