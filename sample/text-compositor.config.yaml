document:
  title: "Sample Document"
  subtitle: "Next Generation Platform"
  author: "AI/Human Co-authoring Team"
  date: "2026-08-14"
  cover: template  # 既定はnone（表紙なし）。このサンプルでは表紙ありを実演する
  toc: true        # 既定はfalse（目次なし）。このサンプルでは目次ありを実演する
  background: "images/draft-watermark.png"  # 本文ページの背景画像（#55）。DRAFT透かしの例
  logo: "images/logo.png"  # ヘッダー左のロゴ画像（#54）
  landscape: false  # 全体を横にする場合は true にする
  paper_size: "a4"  # a3, b5 などの用紙サイズ指定

output:
  filename: "SampleDocument.pdf"
  dir: "."

template:
  path: "template"  # ツール同梱のtemplates/template.typ。独自テンプレートを使う場合は.typで終わるパスを指定する（例: "my_template.typ"）

plugins:
  graphviz: true
  plantuml: true
  mermaid: true

inputs:
  dir: "."

chapters:
  - "01_intro.md"
  - "02_features.md"
  - file: "03_architecture.md"
    paper_size: "a4"  # 必要に応じてこの章だけa3等に変更可能
    background: "images/confidential-watermark.png"  # 章ごとに背景を差し替える例（#55）
  # 図表/データファイルを直接chaptersに指定する例（#53、#36）。それぞれ1ファイル＝1章・
  # 見出しなしで描画されるため、単体では何のサンプルか分かりにくい（#137）。ファイル自体は
  # 変更せず、章ごとのheader設定（#42）でページ上部に短い説明を出すことで対処する。
  - file: "04_deployment.dot"
    header: "サンプル: Graphvizファイルの直接指定 (.dot)"
  - file: "05_workflow.mmd"
    header: "サンプル: Mermaidファイルの直接指定 (.mmd)"
  - file: "06_components.puml"
    header: "サンプル: PlantUMLファイルの直接指定 (.puml)"
  - file: "07_dependencies.csv"
    header: "サンプル: CSVファイルのテーブル変換 (.csv)"
  - aggregate: "testcases"
    title: "システムテスト仕様書 (マトリクス)"
    landscape: true   # テーブルは横長になりやすいのでA4横を指定
    background: null  # 章ごとに背景を解除する例（#55）。表はDRAFT透かしより見やすさを優先
  - aggregate: "testcases"        # 仕様（1テスト＝1ファイル）と、結果（1回の実施＝1ファイル）を1つの表にする例（#65・#66）
    title: "テスト結果 (仕様と結果の結合表)"
    landscape: true
    background: null
    columns:                      # 仕様の列
      - { key: id, title: ID, width: auto, align: center }
      - { key: title, title: 項目 }
      - { key: priority, title: 優先度, width: auto, align: center }
    join:
      aggregate: "testresults"    # 結果のディレクトリ。idで突き合わせる
      runs: latest                # 最新の1件だけ出す（all なら、実施の数だけ行を出す）
      missing: "未実施"            # 結果が無いテストに入れる文字列
      columns:                    # 結果の列
        - { key: tested_at, title: 実施日, width: auto }
        - { key: tested_by, title: 実施者, width: auto }
        - { key: status, title: 合否, width: auto, align: center }
        - { key: note, title: 備考, width: 2fr }
