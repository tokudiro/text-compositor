# C4モデルの文書の例（#618）。1つのモデル（model.dsl）を、すべてのビューが`!include`で共有する。
# 実行: text-compositor --config sample/c4/text-compositor.config.yaml
# 初回は、structurizr-cli（約99MB）とJavaが要る（`plugins.structurizr`が既定でオフのため、ここでオンにしている）。
document:
  title: "ECサイト アーキテクチャ設計書"
  subtitle: "C4モデル"
  author: "text-compositor"
  date: "2026-11-17"
  toc: true

output:
  filename: "C4Sample.pdf"
  dir: "."

plugins:
  structurizr: true

inputs:
  dir: "."

chapters:
  - "01_overview.md"
  - "02_context.md"
  - file: "03_container.md"
    landscape: true   # 横に長い図は、A4横にして、文字を読みやすくする
  - file: "04_component.md"
    landscape: true   # 横に長い図は、A4横にして、文字を読みやすくする
  - file: "05_dynamic.md"
    landscape: true   # 横に長い図は、A4横にして、文字を読みやすくする
  - "06_deployment.md"
